<app-navbar-component></app-navbar-component>
<div class="hero">
    <h4 class="container">
        @if(admin){
            <div class="title">Bem-vindo, administrador <span class="name">{{authService.getLoggedInUsername()}}</span></div>
        }@else {
            @if(userIsLoggedIn()){
                <div class="title">O que você precisa hoje, <span class="name">{{authService.getLoggedInUsername()}}</span>?</div>
            }@else {
                <div class="title">O que você precisa hoje?</div>
            }
        }
        <mat-form-field class="search">
            <input #search matInput placeholder="Pesquisar">
        </mat-form-field>
    </h4>
</div>
<div class="product-display">
    @for (product of productsToDisplay(); track product.id) {
        <app-product-card-component (removeProduct)="removeProduct($event)" [showRemoveProductBtn]="admin" [product]="product"></app-product-card-component>
    }
</div>
